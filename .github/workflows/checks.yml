name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-schemas.txt
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/build_changelog.py --check
      - run: python3 scripts/build_workout_schemas.py --check
      - run: python3 scripts/site_navigation.py --check
